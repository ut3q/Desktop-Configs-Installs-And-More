<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The Arch inter-font package ships InterVariable.ttf, which registers the
     family "Inter Variable". Anything asking for plain "Inter" (Ryoku's docs,
     web CSS, other apps) would otherwise fall through to Noto Sans. -->
<fontconfig>
  <alias binding="same">
    <family>Inter</family>
    <accept><family>Inter Variable</family></accept>
  </alias>
</fontconfig>
