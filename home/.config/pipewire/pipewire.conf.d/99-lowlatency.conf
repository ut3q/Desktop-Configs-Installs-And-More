# Output buffer. 48000Hz: 512=10.7ms, 256=5.3ms, 128=2.7ms.
# Safe at 512 because rtkit gives PipeWire SCHED_RR (see `ps -eo cls,comm`).
# EasyEffects is INPUT-ONLY (rnnoise et al on the USB mic) and the mic is a
# separate device, so it is a separate graph segment -- it does not gate this.
# To try 2.7ms: set quantum to 128 and restart pipewire. Watch `pw-top` ERR.
context.properties = {
    default.clock.quantum     = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 2048
}
