# Stop PipeWire clients from taking realtime scheduling on this machine.
#
# This is not a tuning preference -- it is a workaround for a bug that was
# killing the Caelestia shell several times a minute.
#
# xdg-desktop-portal advertises org.freedesktop.portal.Realtime with
# RTTimeUSecMax = 0 here (rtkit, by contrast, correctly reports 200000).
# libpipewire-module-rt is loaded by every PipeWire *client* and asks the
# portal first, so it calls setrlimit(RLIMIT_RTTIME, {0, 0}) on its host
# process -- and then still obtains SCHED_RR through rtkit. A realtime thread
# with a zero RT budget is killed by the kernel the first time it is on-CPU at
# a scheduler tick: SIGKILL, no core dump, no sender. That is exactly how the
# shell was dying, 2-24s after the dashboard (whose cava visualiser runs a
# PipeWire capture loop every 5.3ms) was opened.
#
# The PipeWire *daemon* is immune because pipewire.conf already sets
# rtportal.enabled = false; only the client config trusts the portal. Module
# args cannot be overridden from a drop-in (arrays append, and the poisoned
# hard limit of 0 can never be raised again), so the choice is between
# replacing client.conf wholesale and simply not letting clients go realtime.
#
# Nothing that works today is lost: client-side RT is currently fatal, not
# beneficial. The audio data path -- pipewire, pipewire-pulse -- keeps its
# realtime threads, because those daemons do not read this file.
#
# If a real-time audio client is ever needed here, the better fix is to copy
# /usr/share/pipewire/client.conf to ~/.config/pipewire/client.conf and set
# rtportal.enabled = false in the module-rt args (verified to give
# RTTIME=200000), or to fix the portal so it stops advertising zero.
context.properties = {
    module.rt = false
}
