# xdg-desktop-portal reads rtkit's limits once at startup and caches them for
# the life of the session -- it never re-queries. rtkit-daemon is D-Bus
# activated, so at login it usually does not exist yet: here the portal started
# Aug 24 06:26 and rtkit only came up Aug 25 19:13, and the portal has been
# advertising org.freedesktop.portal.Realtime RTTimeUSecMax = 0 ever since,
# with rtkit itself correctly reporting 200000 the whole time.
#
# PipeWire's module-rt believes the portal and calls
# setrlimit(RLIMIT_RTTIME, {0,0}) on any client that asks for realtime, then
# still gets SCHED_RR through rtkit. The kernel kills such a process the first
# time that thread is on-CPU at a scheduler tick: SIGKILL, no core dump, no
# sender. That is what was killing the Caelestia shell whenever the dashboard's
# cava visualiser was on screen.
#
# Poking rtkit onto the bus first makes the portal cache the real value. The
# call is bounded and its failure ignored, so it can never hold up the portal.
[Service]
ExecStartPre=-/bin/sh -c 'timeout 5 busctl --system get-property org.freedesktop.RealtimeKit1 /org/freedesktop/RealtimeKit1 org.freedesktop.RealtimeKit1 RTTimeUSecMax >/dev/null 2>&1'
