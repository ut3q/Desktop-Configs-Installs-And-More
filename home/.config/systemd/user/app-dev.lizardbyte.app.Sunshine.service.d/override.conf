[Unit]
# Stock is StartLimitBurst=5 / StartLimitIntervalSec=500. Switching capture mode
# restarts Sunshine, so a handful of mode toggles inside ~8 minutes trips the
# limiter and the service refuses to start at all ("start-limit-hit").
StartLimitBurst=20
StartLimitIntervalSec=60

# The scale watcher already BindsTo this unit, which only handles teardown.
# This is the other half: pull it in on start so it never has to be run by hand.
Wants=sunshine-scale-watch.service

[Service]
# Remote desktop is entirely on-demand -- this unit is disabled, so nothing here
# runs until Sunshine is actually opened. The .desktop entry launches it as
# `systemctl start --u app-dev.lizardbyte.app.Sunshine`, so opening Sunshine
# normally goes through these hooks.
#
# Drop-in ExecStartPre APPENDS to the unit's own `/bin/sleep 5`, so the desktop
# has settled by the time this runs. It must land before Sunshine starts:
# Sunshine resolves output_name once and caches it for the process lifetime.
# The unit's own `/bin/sleep 5` guards against racing a still-booting desktop at
# login autostart. This unit no longer autostarts, so by definition the desktop
# is already up when you open Sunshine -- reset the list and keep a token 1s.
ExecStartPre=
ExecStartPre=/bin/sleep 1
ExecStartPre=/home/aqua/.local/bin/sunshine-vdisplay init

# Teardown, in order. `leave` first: it re-enables the physical monitor, so a
# Sunshine crash mid-stream can never stand you down with a blanked display.
# Then drop the headless output so nothing lingers -- no extra Hyprland output,
# no duplicate Caelestia shell, no compositing for a screen nobody is watching.
ExecStopPost=-/home/aqua/.local/bin/sunshine-virtual-session leave
ExecStopPost=-/home/aqua/.local/bin/sunshine-vdisplay off
