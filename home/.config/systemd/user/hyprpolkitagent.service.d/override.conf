# hyprpolkitagent.service ships WantedBy=graphical-session.target, but that
# target is never activated on this machine: Hyprland is launched from
# hyprland.desktop rather than hyprland-uwsm.desktop, and nothing binds a
# session unit to the target. The enable symlink in
# graphical-session.target.wants/ has therefore never started anything -- the
# agent only ever turned up via D-Bus activation, far too late to beat
# polkit-gnome to the polkitd registration.
#
# The trigger now lives in ~/.config/hypr/hyprland/execs.lua, which starts this
# unit at the point WAYLAND_DISPLAY is known to exist (the unit guards on it
# with ConditionEnvironment, and a skipped condition is not a failure, so a
# too-early start would silently do nothing).
#
# The unit's own After=/PartOf=graphical-session.target are left as shipped:
# inert while that target stays inactive, and correct if this session is ever
# moved to uwsm. An empty-string reset in a drop-in does not clear them here.
[Service]
# Shipped default is Restart=on-failure. An agent that exits cleanly still
# leaves the session with no way to authenticate, so bring it back either way.
Restart=always
RestartSec=2
