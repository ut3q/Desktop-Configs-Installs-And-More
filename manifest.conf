# What this repo tracks. Read by both capture.sh and install.sh.
#
#   home <path>     path relative to $HOME
#   system <path>   absolute path, restored with sudo
#   repo <path>     git repo whose HISTORY is bundled into repos/
#
# Lines starting with # are ignored. Anything not listed here is not backed up.
# Add a line, run ./capture.sh, commit. That is the whole workflow.

# ---------- shell ----------
home .bashrc
home .gitconfig
home .config/fish
home .config/starship.toml

# ---------- window manager / desktop shell ----------
home .config/hypr
home .config/caelestia
home .config/quickshell
home .config/uwsm
home .config/autostart

# ---------- terminals ----------
home .config/foot
home .config/kitty
home .config/ghostty

# ---------- editors ----------
home .config/nvim
home .config/micro
home .config/zed

# ---------- system monitors / tui ----------
home .config/btop
home .config/htop
home .config/nvtop
home .config/fastfetch
home .config/cava

# ---------- theming / toolkit ----------
home .config/gtk-3.0
home .config/gtk-4.0
home .config/qt5ct
home .config/qt6ct
home .config/kdeglobals
home .config/fontconfig

# ---------- apps ----------
home .config/mpv
home .config/obs-studio
home .config/OpenTabletDriver
home .config/swappy
home .config/fuzzel
home .config/easyeffects
home .config/pipewire
home .config/Thunar
home .config/dolphinrc
home .config/spicetify
home .config/arkrc
home .config/osu-servers.conf
home .config/pavucontrol.ini

# ---------- discord clients (settings + themes only, no build artifacts) ----------
home .config/Vencord
home .config/Equicord

# ---------- yt / media tooling ----------
home .config/yt
home .config/yt-dlp
home .config/ytsurf
home .config/yt-x

# ---------- freedesktop plumbing ----------
home .config/user-dirs.dirs
home .config/mimeapps.list
home .config/systemd
home .config/yay

# ---------- system files (restored with sudo) ----------
system /usr/local/bin/backup-mirror
system /usr/local/bin/arch-cleaner
system /usr/local/bin/discord-updater
system /etc/backup-mirror.excludes
system /etc/systemd/system/backup-mirror.service
system /etc/systemd/system/backup-mirror.timer

# ---------- git repos: full history preserved as bundles ----------
repo .config/hypr
repo .config/quickshell/caelestia
